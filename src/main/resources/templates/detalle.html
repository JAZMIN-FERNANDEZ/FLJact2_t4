<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Detalle</title></head>
<body>
    <h1>Detalle del producto</h1>
    <ul th:if="${producto != null}">
        <li>ID: <span th:text="${producto.id}"></span></li>
        <li>Nombre: <span th:text="${producto.nombre}"></span></li>
        <li>Precio: <span th:text="${producto.precio}"></span></li>
        <li>Categoría: <span th:text="${producto.categoria}"></span></li>
    </ul>
    <p th:if="${producto == null}">No existe ese producto</p>
    <p>Autor: <span th:text="${usuario}"></span></p>
    <a th:href="@{/productos}">Volver</a>
</body>
</html>
